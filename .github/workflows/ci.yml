name: CI

# Gate de calidad. Los tests de catálogo de ADR-0002 §B son BLOQUEANTES: una tabla nueva sin RLS
# forzada, una policy con predicado abierto o una FK de dominio sin la columna de tenant ponen esto en
# rojo. Es lo que hace que las reglas no dependan de que alguien las recuerde en la revisión.

on:
  push:
    branches: [main]
  pull_request:

# Un PR que se actualiza cancela la corrida anterior: no tiene sentido pagar dos.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Se usa el MISMO docker-compose que en local, no un `services:` de Actions.
      # Motivo concreto: el compose fija los parámetros de log de Postgres que exige ADR-0002 R29
      # (log_statement=none, log_parameter_max_length=0). Con `services:` no se pueden pasar, el test
      # de R29 fallaría, y la tentación sería saltearlo — o sea, verificar en CI algo distinto de lo
      # que corre en desarrollo.
      - name: Infraestructura local (Postgres + MinIO)
        run: |
          # 🔴 El `.env` de CI se GENERA acá, con secretos ALEATORIOS de un solo uso.
          #
          # Antes era `cp .env.example .env`. Ese archivo dejó de estar trackeado por el incidente #3
          # —un archivo de ejemplo versionado es el camino más corto para que un valor real termine en
          # el repo— y este paso quedó roto, con CI muriendo en la primera línea. De ahí que nadie
          # viera que `0001_aislamiento.test.sql` estaba en rojo.
          #
          # Generarlos, en vez de escribir literales acá, cierra las dos puntas a la vez: no hay
          # ningún valor de credencial en un archivo trackeado (R37), y **ningún secreto de CI puede
          # coincidir con el de un entorno real**, que es exactamente lo que falló en el #3. Además
          # cambian en cada corrida, así que no hay nada que rotar ni que filtrar.
          #
          # `openssl` viene en el runner de Ubuntu. `set -euo pipefail` para que un fallo acá no
          # deje un `.env` a medias y el error aparezca veinte pasos después.
          set -euo pipefail
          gen() { openssl rand -hex 24; }
          PG_PASS="$(gen)"; APP_PASS="$(gen)"; JOB_PASS="$(gen)"; MINIO_PASS="$(gen)"
          LEC_KEY="$(gen)"; LEC_SECRET="$(gen)"; ESC_KEY="$(gen)"; ESC_SECRET="$(gen)"
          {
            echo "APP_ENTORNO=local"
            echo "APP_TIMEZONE=America/Argentina/Cordoba"
            echo "POSTGRES_DB=sistema_contable"
            echo "POSTGRES_USER=sistema_contable"
            echo "POSTGRES_PASSWORD=${PG_PASS}"
            echo "POSTGRES_PORT=5432"
            echo "DATABASE_URL=postgres://sistema_contable:${PG_PASS}@localhost:5432/sistema_contable"
            echo "APP_DB_USER=app_request_dev"
            echo "APP_DB_PASSWORD=${APP_PASS}"
            echo "DATABASE_URL_APP=postgres://app_request_dev:${APP_PASS}@localhost:5432/sistema_contable"
            echo "JOB_DB_PASSWORD=${JOB_PASS}"
            echo "DATABASE_URL_JOB=postgres://app_job:${JOB_PASS}@localhost:5432/sistema_contable"
            echo "MINIO_ROOT_USER=sistema_contable"
            echo "MINIO_ROOT_PASSWORD=${MINIO_PASS}"
            echo "MINIO_API_PORT=9000"
            echo "MINIO_CONSOLE_PORT=9001"
            echo "S3_BUCKET=sistema-contable"
            echo "S3_REGION=us-east-1"
            echo "S3_ENDPOINT=http://localhost:9000"
            echo "S3_FORCE_PATH_STYLE=true"
            # 🔴 Identificadores propios de CI, GENERADOS — no un literal fijo, dos veces ya (ver
            # HANDOFF): primero fue `app_lectura_dev`, después `ci_lectura`/`ci_escritura`, y las dos
            # veces el problema fue el mismo — cualquier literal fijo en un KEY con nombre secreto
            # (`ACCESS_KEY` matchea `NOMBRE_SECRETO`) hace que ESTE MISMO archivo se autodenuncie: el
            # `.env` que este paso genera queda con esa cadena, y `barrer()` la encuentra otra vez en
            # `ci.yml` como "valor vivo" — el checkeo no distingue "coincide con un entorno real" de
            # "coincide con lo que el propio archivo acaba de escribir". Cambiar el string de vuelta no
            # arregla nada: solo generado (como el resto de los secretos de este bloque) el valor deja
            # de ser un literal trackeado, así que no hay nada que `barrer()` pueda encontrar.
            echo "S3_LECTURA_ACCESS_KEY_ID=${LEC_KEY}"
            echo "S3_LECTURA_SECRET_ACCESS_KEY=${LEC_SECRET}"
            echo "S3_ESCRITURA_ACCESS_KEY_ID=${ESC_KEY}"
            echo "S3_ESCRITURA_SECRET_ACCESS_KEY=${ESC_SECRET}"
            echo "AUTH_PROVIDER=dev-identidad-fija"
            echo "DEV_USER_ID="
            echo "CRON_SECRET=$(gen)"
            echo "IDENTIFICADOR_PEPPER=$(gen)"
            echo "IDENTIFICADOR_PEPPER_ID=v1"
          } > .env
          docker compose up -d postgres minio minio-init
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U sistema_contable -d sistema_contable; then
              break
            fi
            sleep 2
          done

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migraciones (dueño del esquema)
        run: pnpm db:migrate

      - name: Roles de aplicación
        run: pnpm db:setup

      - name: Typecheck (TypeScript estricto)
        run: pnpm typecheck

      # Incluye los tests de catálogo (R1–R15), los de aislamiento a través de conUsuario/conJob, y
      # el barrido INV-8 sobre los tres caminos dorados de logging.
      - name: Tests
        run: pnpm test

      # Los invariantes escritos en SQL, que corren con las TRES credenciales distintas — cada pasada
      # con el rol que le corresponde. Esa separación es parte de lo que se verifica: si una sola
      # credencial pudiera hacer las tres, el diseño estaría mal.
      - name: Invariantes de aislamiento en SQL (tres pasadas, tres roles)
        run: |
          set -euo pipefail
          # Las contraseñas salen del `.env` generado arriba, no de un literal en este archivo.
          # Estaban hardcodeadas y eran, cadena por cadena, las mismas que vivían en el piloto: el
          # incidente #3 en miniatura. Ahora son aleatorias por corrida y no hay nada que allowlistear.
          set -a; . ./.env; set +a
          docker compose exec -T postgres \
            psql -U sistema_contable -d sistema_contable -v ON_ERROR_STOP=1 -v ddl=1 \
            < packages/data/sql/tests/0001_aislamiento.test.sql
          docker compose exec -T -e PGPASSWORD="$JOB_DB_PASSWORD" postgres \
            psql -h 127.0.0.1 -U app_job -d sistema_contable -v ON_ERROR_STOP=1 \
            < packages/data/sql/tests/0001_aislamiento.test.sql
          docker compose exec -T -e PGPASSWORD="$APP_DB_PASSWORD" postgres \
            psql -h 127.0.0.1 -U app_request_dev -d sistema_contable -v ON_ERROR_STOP=1 \
            < packages/data/sql/tests/0001_aislamiento.test.sql

      # Barrido de fuga sobre el REPO, no sobre los logs. Cierra el agujero que ningún otro control
      # miraba: un importe o un CUIT de un cliente copiado a un comentario o a un doc.
      #
      # Acá corre en modo CI, porque `privado/` no existe en el runner: compara cada candidato contra la
      # allowlist de huellas commiteada. Un candidato nuevo pone esto en rojo, y para aceptarlo hay que
      # correr `pnpm barrido --aceptar` en la máquina que sí tiene el material real y que sí puede
      # cruzarlo. Así CI no puede quedar verde con un valor que nadie verificó.
      - name: Barrido de fuga sobre el repo (condición de salida nº 4)
        run: pnpm barrido

      # Gate de fixtures (condición de salida nº 10). Corre ANTES de los tests a propósito: si el fixture
      # tiene un valor real, un identificador con verificador válido o perdió los rasgos del formato, no
      # tiene sentido correr los tests que se apoyan en él.
      #
      # Acá el chequeo 1 (cruce contra el material real) queda declarado como NO ejecutado, porque
      # `privado/` no existe en el runner. El que vale corre en la máquina que tiene el material, en
      # pre-commit. CI cubre los otros seis, incluido `git check-ignore` — que es precisamente el que
      # detecta un fixture que existe local y no existe acá.
      - name: Gate de fixtures (condición de salida nº 10)
        run: pnpm fixtures:verificar

      # El fixture es DETERMINÍSTICO: misma semilla, mismo archivo byte a byte. Si regenerarlo produce un
      # diff, el fixture commiteado no corresponde a la especificación que dice generarlo — y entonces
      # nadie sabe de dónde salieron esos bytes.
      - name: El fixture commiteado corresponde a su especificación
        run: |
          pnpm fixtures:generar
          if ! git diff --exit-code -- packages/ingesta/tests/fixtures/; then
            echo "ERROR: regenerar el fixture produce un diff."
            echo "El archivo commiteado no salió de la especificación actual. Corré pnpm fixtures:generar."
            exit 1
          fi
          echo "OK: el fixture es reproducible desde su especificación."

      # Un secreto commiteado se considera público para siempre (ADR-0002 §E.4.8): se rota, no se
      # limpia el historial. Este paso existe para no llegar a esa conversación.
      - name: No hay secretos en el repo (R37)
        run: |
          # R33 quedó reemplazada por R37 (incidente #3): decía «`.env*` gitigneado SALVO
          # `.env.example`», y esa excepción de su propio enunciado ERA el vector. Hoy no hay
          # excepción: ningún archivo con forma de entorno puede estar trackeado.
          if git ls-files | grep -E '(^|/)\.env(\.[^/]+)?$'; then
            echo "ERROR: hay un archivo con forma de .env trackeado. Ninguno va al repo."
            exit 1
          fi
          # Excepción por RUTA EXACTA, nunca por patrón: exactamente dos archivos tienen a propósito
          # un literal de clave privada TRUNCADO y no funcional ("MIIE", no una clave real), para
          # probar que el redactor (`contieneDatoSensible`) lo detecta. Si agregás un tercer archivo
          # con este mismo literal sintético, sumalo acá por ruta exacta — NUNCA cambies esto a
          # `*.test.ts` ni a `:!**/*.test.ts`: es exactamente la puerta que R33 dejó abierta y que
          # R37 existe para cerrar. Un secreto real en cualquier OTRO archivo `.test.ts` tiene que
          # seguir cortando el build.
          if git grep -nE -- '-----BEGIN [A-Z ]*PRIVATE KEY' -- . ':!*.md' \
              ':!packages/shared/tests/forma.test.ts' ':!packages/shared/tests/redactor.test.ts'; then
            echo "ERROR: hay material de clave privada en el repo."
            exit 1
          fi
          echo "OK: sin .env trackeado ni claves privadas."

      - name: Logs del motor sin datos (diagnóstico si algo falló)
        if: failure()
        run: docker compose logs postgres | tail -50
